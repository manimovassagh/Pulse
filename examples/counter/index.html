<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulse Counter</title>
    <style>
      body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0; }
      .app { text-align: center; }
      button { font: inherit; margin: 0.25rem; padding: 0.6rem 1.1rem; border-radius: 0.5rem; border: 1px solid #334155; background: #1e293b; color: inherit; cursor: pointer; }
      button:hover:not([disabled]) { background: #334155; }
      button[disabled] { opacity: 0.4; cursor: default; }
      .stats { color: #94a3b8; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { start } from "./pulse.js";
      start("./app.wasm");
    </script>
  </body>
</html>
